return `<button class="text back" data-nav="${isAdmin()?'admin':'hall'}">← 返回${isAdmin()?'后台管理':'项目大厅'}</button><div class="heading"><div>${tag(p)}<h1 style="margin-top:14px;font-size:29px">${esc(p.title)}</h1><p>${categoryNames[p.category]}　·　发布人 ${esc(users.find(x=>x.id===p.owner)?.username)}　·　${fmtDate(p.published||p.created)}</p></div></div><div class="split"><div class="sheet"><div class="section"><h3>项目需求</h3><div class="prose">${esc(p.description)}</div></div><div class="section"><h3>交付要求</h3><div class="prose">${esc(p.deliverables||'尚未填写')}</div><div class="meta-grid"><div><span class="key">项目截止时间</span>${fmtDate(p.deadline)}</div><div><span class="key">项目报酬</span>报酬由双方协商</div>${Object.entries(p.extra||{}).filter(([,v])=>v).map(([k,v])=>`<div><span class="key">${({duration:'时长',style:'风格',format:'交付格式'})[k]||k}</span>${esc(v)}</div>`).join('')}</div></div><div class="section"><h3>参考附件</h3>${p.attachments.length?p.attachments.map(a=>`<div class="file-row"><span>${esc(a.name)} <small>${(a.size/1024/1024).toFixed(1)} MB</small></span>${priv?`<button class="text" data-download="${a.id}">下载</button>`:'<span class="small muted">认领后可下载</span>'}</div>`).join(''):'<p class="muted small">暂无附件</p>'}</div>${p.reviews?.length&&priv?`<div class="section"><h3>审核记录</h3>${p.reviews.map(r=>`<p class="small muted">${r.decision==='approve'?'审核通过':'审核驳回'} · ${fmtDate(r.at)}${r.reason?' · '+esc(r.reason):''}</p>`).join('')}</div>`:''}${deliverySection(p)}${p.status==='EXIT_PENDING'&&priv?`<div class="section"><h3>退出申请</h3><p class="prose">${esc(exitRequests.find(r=>r.id===p.exitId)?.reason||'—')}</p></div>`:''}</div><aside class="aside-sheet"><h3>合作信息</h3><p>项目报酬由双方线下协商，认领前请仔细阅读需求。</p><div class="section"><span class="muted small">${own?'承接方':'需求方'}联系方式</span><p style="font-size:20px;color:var(--ink)">${contactVisible?esc(contact):'认领成功后可见'}</p>${p.claim?`<p>当前承接方：${esc(users.find(x=>x.id===p.claim.userId)?.username)}</p>`:''}</div>${action}${isAdmin()&&p.status==='PENDING_REVIEW'?'<button class="primary" data-review="approve">审核通过</button><button data-review="reject">驳回项目</button>':''}</aside></div>`}
function publishView(){const u=user();if(!u)return authEmpty();const p=editId?project(editId):null;if(p&&(p.owner!==current||!['DRAFT','REJECTED'].includes(p.status)))return empty('当前项目不能编辑','待认领项目请先撤回，已认领项目不可修改。');const val=k=>esc(p?.[k]||'');return `<div class="heading"><div><div class="eyebrow">CREATE / 发布需求</div><h1 class="spaced">${p?'编辑项目':'让想法开始发生。'}</h1><p>清晰的需求，是一次高效合作的开始。</p></div></div><div class="split"><div class="sheet"><form id="project-form" novalidate><label for="project-title">项目标题 *</label><input id="project-title" name="title" value="${val('title')}" maxlength="50" placeholder="5–50 个字，说清楚要完成什么"><div class="form-grid"><div><label for="project-category">项目分类 *</label><select id="project-category" name="category">${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${p?.category===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="project-deadline">项目截止时间 *</label><input id="project-deadline" name="deadline" type="datetime-local" value="${p?.deadline?new Date(new Date(p.deadline).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div></div><label for="project-description">需求描述 *</label><textarea id="project-description" name="description" maxlength="5000" placeholder="说明背景、目标、具体工作内容及参考方向，至少 20 字。">${val('description')}</textarea><label for="project-deliverables">交付要求 *</label><textarea id="project-deliverables" name="deliverables" maxlength="2000" placeholder="说明交付数量、文件格式与质量要求，至少 10 字。">${val('deliverables')}</textarea><div id="extended-fields">${extraFields(p?.category||'general',p?.extra)}</div><label for="project-contact">联系手机号 *</label><input id="project-contact" name="contact" inputmode="tel" maxlength="11" value="${esc(p?.contact||u.mobile)}"><p class="field-hint">仅在认领成功后向承接方展示。</p><label for="project-files">参考附件</label><input id="project-files" name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.docx,.mp4"><p class="field-hint">最多 5 个，每个 20 MB；仅保存在当前页面。${p?.attachments.length?'已有 '+p.attachments.length+' 个附件，未选择新文件时保留。':''}</p><p id="project-error" class="error" role="status"></p><div class="toolbar"><button type="button" data-action="save-draft">保存草稿</button><button class="primary" type="submit">提交审核</button></div></form></div><aside class="aside-sheet"><h3>发布前，请确认</h3><p>需求与交付要求完整清晰。</p><p>提交后进入平台审核，通过后才出现在大厅。</p><p>本期不填写报酬金额，由双方线下协商。</p><p>认领后核心需求将锁定。</p></aside></div>`}
function extraFields(c,values={}){if(c==='general')return '';return `<div class="section"><h3>分类补充信息 <span class="muted small">选填</span></h3><div class="form-grid">${(c==='video'?['duration','style','format']:c==='voice'?['duration','style']:['style','format']).map(k=>`<div><label for="extra-${k}">${({duration:'时长',style:'期望风格',format:'交付格式'})[k]}</label><input id="extra-${k}" name="extra_${k}" maxlength="100" value="${esc(values?.[k]||'')}"></div>`).join('')}</div></div>`}
function authEmpty(){return empty('登录后，开始你的合作','发布项目、管理个人资料和查看我的项目需要登录。')+'<div class="toolbar" style="justify-content:center"><button class="primary" data-nav="login">登录 / 注册</button></div>'}
function mineView(){if(!user())return authEmpty();const owned=projects.filter(p=>p.owner===current);const history=claims.filter(c=>c.userId===current);return `<div class="heading"><div><div class="eyebrow">WORKSPACE / 我的项目</div><h1 class="spaced">每一次合作，都在这里。</h1></div><button data-nav="publish" class="primary">发布新项目</button></div><div class="tabs"><button data-mine="published" class="${mineTab==='published'?'active':''}">我发布的 · ${owned.length}</button><button data-mine="claimed" class="${mineTab==='claimed'?'active':''}">我认领的 · ${history.length}</button></div>${mineTab==='published'?(owned.map(p=>row(p)).join('')||empty('还没有发布项目','发布你的第一个需求，让合适的人看到。')):(history.map(c=>row(project(c.projectId),c.status==='EXITED'?'此条认领已退出':c.status==='COMPLETED'?'已完成承接':'当前承接')).join('')||empty('还没有认领项目','去项目大厅发现适合你的合作。'))}`}
function profileView(){const u=user();if(!u)return authEmpty();return `<div class="heading"><div><div class="eyebrow">PROFILE / 个人中心</div><h1 class="spaced">让合作伙伴更了解你。</h1><p>填写身份信息后即可认领；声音与视频素材按项目需要补充。</p></div><span class="tag ${identityOK(u)?'green':''}">${identityOK(u)?'身份信息已完善':'身份信息待完善'}</span></div><div class="tabs"><button data-profile="basic" class="${profileTab==='basic'?'active':''}">个人资料</button><button data-profile="identity" class="${profileTab==='identity'?'active':''}">身份信息</button><button data-profile="materials" class="${profileTab==='materials'?'active':''}">声音与视频</button></div>${profileTab==='basic'?`<div class="sheet" style="max-width:760px"><h2>个人资料</h2><form id="basic-form"><div class="form-grid"><div><label for="basic-name">用户名 *</label><input id="basic-name" name="username" value="${esc(u.username)}" minlength="2" maxlength="20" required></div><div><label for="basic-avatar">头像</label><input id="basic-avatar" name="avatar" type="file" accept="image/png,image/jpeg"></div></div>${u.avatar?`<img class="avatar-image spaced" src="${esc(u.avatar)}" alt="个人头像">`:''}<label for="basic-bio">个人介绍</label><textarea id="basic-bio" name="bio" maxlength="500" placeholder="介绍一下你自己">${esc(u.bio)}</textarea><label for="basic-skills">擅长领域</label><input id="basic-skills" name="skills" maxlength="200" value="${esc(u.skills)}" placeholder="例如：视频剪辑、视觉设计、AI 创作"><button type="submit" class="primary spaced">保存资料</button></form></div>`:profileTab==='identity'?`<div class="sheet" style="max-width:760px"><h2>身份信息登记</h2><p class="muted">填写真实姓名与手机号即可，不进行实名核验。</p><form id="identity-form"><label for="identity-name">真实姓名 *</label><input id="identity-name" name="realName" value="${esc(u.realName)}" placeholder="演示请使用示例姓名" minlength="2" maxlength="50" required><label for="identity-mobile">手机号 *</label><input id="identity-mobile" value="${esc(u.mobile)}" readonly><p class="field-hint">默认使用注册号码。身份信息不向项目大厅公开。</p><p id="identity-error" class="error" role="status"></p><button class="primary" type="submit">保存身份信息</button></form></div>`:materialsView(u)}`}
function materialsView(u){return `<div class="notice">个人私有制作素材，仅支持本人声音和形象。文件仅保存在当前页面，不会发送到服务器；刷新后清空。</div><div class="material-grid">${['audio','video'].map(kind=>`<section class="material"><div class="eyebrow">${kind==='audio'?'VOICE / 声音素材':'VIDEO / 视频素材'}</div><h2 class="spaced">${kind==='audio'?'保存你的声音。':'记录你的形象。'}</h2><p>${kind==='audio'?'上传音频或在线录音，供后续制作使用。':'上传本人视频或开启摄像头在线录制。'}</p><div class="toolbar"><button data-upload="${kind}" class="primary">上传${kind==='audio'?'音频':'视频'}</button><button data-record="${kind}">在线${kind==='audio'?'录音':'录像'}</button></div><input type="file" id="material-${kind}" accept="${kind==='audio'?'audio/*':'video/*'}" data-material="${kind}" hidden>${u.materials.filter(m=>m.kind===kind).map(m=>`<div class="file-row spaced"><div><div class="name">${esc(m.name)}</div><span class="small muted">${m.method==='recording'?'在线录制':'文件上传'} · ${(m.blob.size/1024/1024).toFixed(1)} MB · 已保存</span><div class="toolbar"><button class="text" data-preview="${m.id}">预览</button><button class="text" data-remove-material="${m.id}">删除</button></div></div></div>`).join('')||'<p class="small muted spaced">暂无素材</p>'}</section>`).join('')}</div>`}
function adminAccounts(){return [...users,{id:'admin',username:'演示管理员',mobile:'',realName:'',bio:'',skills:'',materials:[],accountType:'admin'}]}
function adminProjectRows(){if(!isAdmin())return [];const q=adminKeyword.trim().toLowerCase();return projects.filter(p=>(adminStatus==='all'||p.status===adminStatus)&&(adminCategory==='all'||p.category===adminCategory)&&(!q||[p.title,p.id,users.find(u=>u.id===p.owner)?.username,users.find(u=>u.id===p.claim?.userId)?.username].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>new Date(b.created)-new Date(a.created))}
function adminUserRows(){if(!isAdmin())return [];const q=adminKeyword.trim().toLowerCase();return adminAccounts().filter(u=>(adminIdentity==='all'||(adminIdentity==='complete'?identityOK(u):u.id!=='admin'&&!identityOK(u)))&&(!q||[u.id,u.username,u.mobile,u.realName].some(v=>String(v||'').toLowerCase().includes(q))))}
function adminPager(total){const pages=Math.max(1,Math.ceil(total/10));adminPage=Math.max(1,Math.min(adminPage,pages));return pages>1?`<div class="pager"><button data-admin-page="${adminPage-1}" ${adminPage===1?'disabled':''}>上一页</button><span>${adminPage} / ${pages}</span><button data-admin-page="${adminPage+1}" ${adminPage===pages?'disabled':''}>下一页</button></div>`:''}
function adminTable(){if(!isAdmin())return '';const isUsers=adminTab==='users',rows=isUsers?adminUserRows():adminProjectRows(),pager=adminPager(rows.length),visible=rows.slice((adminPage-1)*10,adminPage*10);const heads=isUsers?['用户 / ID','手机号','账号类型','身份信息','发布 / 认领','声音 / 视频','操作']:['项目 / ID','分类','需求方','承接方','状态','创建 / 截止','操作'];return `<div class="list-head"><span>共 <strong>${rows.length}</strong> ${isUsers?'位用户':'个项目'}</span><span>每页 10 条${isUsers?'':' · 最新创建优先'}</span></div>${rows.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${visible.map(x=>isUsers?adminUserRow(x):adminProjectRow(x)).join('')}</tbody></table></div>`:empty('暂无符合条件的记录','调整搜索或筛选条件后重试。')}${pager}`}
function adminUserRow(u){const posted=projects.filter(p=>p.owner===u.id).length,taken=claims.filter(c=>c.userId===u.id).length,audio=u.materials.filter(m=>m.kind==='audio').length,video=u.materials.filter(m=>m.kind==='video').length;return `<tr><td><span class="table-name">${esc(u.username)}</span><small>${esc(u.id)}</small></td><td>${esc(u.mobile||'—')}</td><td>${u.id==='admin'?'平台管理员':'普通用户'}</td><td><span class="tag ${identityOK(u)?'green':''}">${u.id==='admin'?'不适用':identityOK(u)?'已完善':'待完善'}</span></td><td>${posted} / ${taken}</td><td>${audio} / ${video}</td><td><button data-admin-user="${esc(u.id)}">查看用户</button></td></tr>`}
function adminProjectRow(p){return `<tr><td class="table-title"><span class="table-name">${esc(p.title)}</span><small>${esc(p.id)}</small></td><td>${esc(categoryNames[p.category]||'—')}</td><td>${esc(users.find(u=>u.id===p.owner)?.username||'—')}</td><td>${esc(users.find(u=>u.id===p.claim?.userId)?.username||'—')}</td><td>${tag(p)}</td><td>${fmtDate(p.created)}<small>截止 ${fmtDate(p.deadline)}</small></td><td><div class="table-actions"><button data-detail="${esc(p.id)}">${p.status==='PENDING_REVIEW'?'查看并审核':'查看详情'}</button></div></td></tr>`}
function renderAdminTable(){if(!isAdmin()||route!=='admin')return;const el=$('admin-results');if(el)el.innerHTML=adminTable()}
function showAdminUser(id){if(!isAdmin())return toast('仅管理员可以查看用户记录');const u=adminAccounts().find(u=>u.id===id);if(!u)return toast('用户不存在');const own=projects.filter(p=>p.owner===id),taken=claims.filter(c=>c.userId===id);const related=[...new Set([...own.map(p=>p.id),...taken.map(c=>c.projectId)])].map(project).filter(Boolean);modal('用户详情',`<div class="meta-grid"><div><span class="key">用户名</span>${esc(u.username)}</div><div><span class="key">手机号</span>${esc(u.mobile||'—')}</div><div><span class="key">账号类型</span>${id==='admin'?'平台管理员':'普通用户（可发布与承接）'}</div><div><span class="key">身份信息登记</span>${id==='admin'?'不适用':identityOK(u)?'已完善':'待完善'}</div><div><span class="key">登记姓名</span>${esc(u.realName||'—')}</div><div><span class="key">发布 / 历史认领</span>${own.length} / ${taken.length}</div></div><div class="section"><h3>个人介绍与擅长领域</h3><p class="prose">${esc(u.bio||'尚未填写')}</p><p class="prose">${esc(u.skills||'尚未填写')}</p></div><div class="section"><h3>素材登记</h3><p>声音 ${u.materials.filter(m=>m.kind==='audio').length} 份 · 视频 ${u.materials.filter(m=>m.kind==='video').length} 份</p><p class="small muted">展示登记数量，原始声音与视频仅由本人管理。</p></div><div class="section"><h3>关联项目</h3>${related.length?related.map(p=>`<div class="admin-related"><span>${esc(p.title)}<br><small>${esc(statusNames[p.status])}</small></span><button data-detail="${esc(p.id)}">查看</button></div>`).join(''):'<p>暂无关联项目。</p>'}</div>`,'<button data-action="close-modal">关闭</button>')}
function adminView(){if(!isAdmin())return empty('仅管理员可访问','普通账号无法查看后台用户与项目记录。');const pending=projects.filter(p=>p.status==='PENDING_REVIEW').length,tab=(k,label)=>`<button data-admin-tab="${k}" class="${adminTab===k?'active':''}">${label}</button>`;let body='';if(adminTab==='reviews'){const rows=projects.filter(p=>reviewTab==='pending'?p.status==='PENDING_REVIEW':p.reviews?.length);body=`<div class="tabs"><button data-review-tab="pending" class="${reviewTab==='pending'?'active':''}">待审核 · ${pending}</button><button data-review-tab="history" class="${reviewTab==='history'?'active':''}">审核历史</button></div>${rows.map(p=>row(p)).join('')||empty(reviewTab==='pending'?'暂无待审核项目':'暂无审核历史','需求方提交后，可在这里查看并审核。')}`}else{body=`${adminTab==='projects'?`<div class="admin-statuses"><button data-admin-status="all" class="${adminStatus==='all'?'active':''}">全部<span>${projects.length}</span></button>${Object.entries(statusNames).map(([k,v])=>`<button data-admin-status="${k}" class="${adminStatus===k?'active':''}">${v}<span>${projects.filter(p=>p.status===k).length}</span></button>`).join('')}</div>`:''}<div class="admin-filters"><input id="admin-search" value="${esc(adminKeyword)}" placeholder="${adminTab==='users'?'搜索用户名、手机号、姓名或用户 ID':'搜索标题、项目 ID、需求方或承接方'}" aria-label="搜索后台记录">${adminTab==='users'?`<select id="admin-identity" aria-label="筛选身份信息"><option value="all">全部身份信息</option><option value="complete" ${adminIdentity==='complete'?'selected':''}>身份信息已完善</option><option value="incomplete" ${adminIdentity==='incomplete'?'selected':''}>身份信息待完善</option></select><button data-action="admin-clear">重置筛选</button>`:`<select id="admin-category" aria-label="筛选项目分类"><option value="all">全部分类</option>${Object.entries(categoryNames).map(([k,v])=>`<option value="${k}" ${adminCategory===k?'selected':''}>${v}</option>`).join('')}</select><button data-action="admin-clear">重置筛选</button>`}</div><div id="admin-results">${adminTable()}</div><p class="admin-note">${adminTab==='users'?'普通账号同时支持发布与承接；认领数量包含历史退出记录。':'覆盖草稿、待审核、驳回及全部履约状态；状态数量来自当前演示数据。'}</p>`}return `<div class="heading"><div><div class="eyebrow">ADMIN / 共创管理后台</div><h1 class="spaced">后台管理</h1><p>集中查看平台用户、项目进度与待处理需求。</p></div><button data-nav="hall">返回项目大厅</button></div><div class="admin-summary"><span>平台用户<strong>${adminAccounts().length}</strong></span><span>全部项目<strong>${projects.length}</strong></span><span>待审核<strong>${pending}</strong></span><span>已完成<strong>${projects.filter(p=>p.status==='COMPLETED').length}</strong></span></div><div class="tabs">${tab('users','用户列表')}${tab('projects','项目列表')}${tab('reviews',`项目审核 · ${pending}`)}</div>${body}`}

function modal(title,content,buttons=''){$('modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button data-action="close-modal" aria-label="关闭">×</button></div>${content}<div class="toolbar">${buttons}</div>`;$('modal').showModal()}
function openClaim(){const p=project(selected),u=user();if(needLogin(p.id))return;if(p.owner===current)return toast('不能认领自己发布的项目');if(!identityOK(u)){returnId=p.id;profileTab='identity';go('profile');return toast('请先填写真实姓名和手机号，保存后即可认领')}if(p.status!=='OPEN')return toast('该项目已不可认领');modal('确认认领这个项目？',`<p>${esc(p.title)}</p><p>确认后项目立即分配给你，其他人不能再认领。报酬由双方线下协商，认领成功后可查看对方手机号。</p><label class="check"><input type="checkbox" id="claim-ack">我已阅读项目需求，并了解报酬由双方协商。</label>`,'<button data-action="close-modal">再看看</button><button class="primary" data-action="confirm-claim">确认认领</button>')}
function confirmClaim(){const p=project(selected);if(!user()||!identityOK(user())||p.owner===current||p.status!=='OPEN'){closeModal();render();return toast('项目状态或身份信息已变化，请刷新后重试')}if(!$('claim-ack').checked)return toast('请先勾选阅读确认');const c={id:uid(),projectId:p.id,userId:current,status:'ACTIVE',created:new Date().toISOString()};claims.push(c);p.claim={id:c.id,userId:current};p.status='CLAIMED';closeModal();render();toast('认领成功，已开放双方联系方式')}
function saveProject(draft){const f=$('project-form');if(!f)return;const d=new FormData(f),u=user();if(!u)return;const old=editId?project(editId):null;if(old&&(old.owner!==current||!['DRAFT','REJECTED'].includes(old.status)))return toast('当前项目不能编辑');const title=String(d.get('title')||'').trim(),description=String(d.get('description')||'').trim(),deliverables=String(d.get('deliverables')||'').trim(),contact=String(d.get('contact')||'').trim(),deadline=d.get('deadline');let error='';if(!draft){if(title.length<5)error='项目标题请填写 5–50 个字';else if(description.length<20)error='需求描述至少填写 20 个字';else if(deliverables.length<10)error='交付要求至少填写 10 个字';else if(!deadline||new Date(deadline)<=new Date())error='请选择晚于当前时间的截止时间';else if(!/^1\d{10}$/.test(contact))error='请填写有效的 11 位联系手机号'}const files=Array.from($('project-files').files);if(files.length>5||files.some(x=>x.size>20*1024*1024))error='最多 5 个附件，每个不超过 20 MB';if(files.some(x=>!(/\.(pdf|png|jpe?g|docx|mp4)$/i.test(x.name))))error='附件仅支持 PDF、PNG、JPG、DOCX、MP4';if(error){$('project-error').textContent=error;return}const attachments=files.length?files.map(x=>({id:uid(),name:x.name,size:x.size,file:x,url:URL.createObjectURL(x)})):(old?.attachments||[]);if(files.length)old?.attachments.forEach(x=>URL.revokeObjectURL(x.url));const extra={};for(const k of ['duration','style','format'])if(d.get('extra_'+k))extra[k]=String(d.get('extra_'+k));const payload={title:title||'未命名项目',description,deliverables,category:d.get('category'),contact,deadline:deadline?new Date(deadline).toISOString():null,extra,attachments,status:draft?'DRAFT':'PENDING_REVIEW'};let p;if(old){Object.assign(old,payload);p=old}else{p={id:uid(),owner:current,created:new Date().toISOString(),published:null,claim:null,reviews:[],...payload};projects.unshift(p)}editId=null;go('detail',p.id);toast(draft?'草稿已保存':'已提交，等待平台审核')}
function handleReview(decision){if(!isAdmin())return toast('只有管理员能审核项目');const p=project(selected);if(p.status!=='PENDING_REVIEW')return toast('该项目已不在待审核状态');if(decision==='reject'){modal('驳回项目','<p>说明需要补充或修改的内容，需求方修改后可重新提交。</p><label for="review-reason">驳回原因 *</label><textarea id="review-reason" minlength="5" maxlength="500" placeholder="至少填写 5 个字"></textarea>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-reject">确认驳回</button>');return}commitReview('approve','')}
function commitReview(decision,reason){const p=project(selected);if(!isAdmin()||p.status!=='PENDING_REVIEW')return toast('当前操作已失效');p.status=decision==='approve'?'OPEN':'REJECTED';if(!p.published&&decision==='approve')p.published=new Date().toISOString();p.reviews.push({decision,reason,at:new Date().toISOString()});closeModal();render();toast(decision==='approve'?'审核通过，项目已进入大厅':'已驳回，需求方可查看原因并修改')}
function requestExit(){const p=project(selected);if(p.claim?.userId!==current||!['CLAIMED','REWORK'].includes(p.status))return toast('当前不能申请退出');modal('申请退出项目','<p>需求方同意后，项目重新开放认领。申请处理中仍保留你的承接关系。</p><label for="exit-reason">退出原因 *</label><textarea id="exit-reason" maxlength="500" placeholder="请说明原因，至少 5 个字"></textarea>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-exit">提交申请</button>')}
function decideExit(accept){const p=project(selected);if(p.owner!==current||p.status!=='EXIT_PENDING')return toast('当前不能处理申请');if(!accept){modal('拒绝退出申请','<label for="deny-reason">处理说明 *</label><textarea id="deny-reason" maxlength="500" placeholder="请说明原因，至少 5 个字"></textarea>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-deny-exit">确认拒绝</button>');return}modal('同意退出？','<p>原承接关系将解除，原承接方失去联系方式查看权限，项目重新开放认领。</p>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-accept-exit">同意退出</button>')}
function commitExit(accept,reason=''){const p=project(selected);if(p.owner!==current||p.status!=='EXIT_PENDING')return toast('申请已处理');const r=exitRequests.find(x=>x.id===p.exitId);if(!r||r.status!=='PENDING')return;r.status=accept?'ACCEPTED':'DENIED';r.decisionReason=reason;if(accept){const c=claims.find(x=>x.id===p.claim.id);c.status='EXITED';c.ended=new Date().toISOString();p.claim=null;p.status='OPEN'}else p.status=r.previousStatus||'CLAIMED';p.exitId=null;closeModal();render();toast(accept?'已同意退出，项目重新开放认领':'已拒绝退出，原承接关系保留')}
function filePreview(kind,blob,method,name){if(!user())return;stopCapture();discardPending();const url=URL.createObjectURL(blob);pendingMaterial={kind,blob,method,name,url};modal('预览并保存素材',`<p>${esc(name)}</p><${kind==='audio'?'audio':'video'} controls src="${url}"></${kind==='audio'?'audio':'video'}><label for="material-name">素材名称</label><input id="material-name" maxlength="50" value="${esc(name.slice(0,50))}"><label class="check"><input type="checkbox" id="material-consent">确认这是我本人的${kind==='audio'?'声音':'声音和形象'}，同意仅保存在当前演示会话中供预览管理。</label><p class="small muted">保存不代表已创建声音模型或数字人，也不会自动开始训练。</p>`,`<button data-action="close-modal">取消</button>${method==='recording'?`<button data-rerecord="${kind}">重新录制</button>`:''}<button class="primary" data-action="save-material">确认保存</button>`)}
async function startRecording(kind){closeModal();if(!user())return;if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){modal('当前浏览器无法录制','<p>请使用支持录制的浏览器，并在 HTTPS 或本地可信环境下打开。你仍可使用文件上传入口。</p>','<button data-action="close-modal">知道了</button>');return}const ownerId=current;const ctx={kind,aborted:false,stream:null,recorder:null,chunks:[],timer:null,started:0,bytes:0};recording=ctx;modal(kind==='audio'?'在线录音':'在线录像',`<p>仅采集你本人的声音${kind==='video'?'和形象':''}。授权后先检查设备，再由你开始录制。</p><div class="record-box"><div id="capture-state">正在等待设备授权…</div>${kind==='video'?'<video id="capture-live" autoplay playsinline muted></video>':''}<div id="capture-time" class="spaced">00:00</div></div>`,`<button data-action="close-modal">取消</button><button class="primary" id="capture-start" disabled data-action="capture-start">开始录制</button><button id="capture-stop" data-action="capture-stop" disabled>停止并预览</button>`);try{const stream=await navigator.mediaDevices.getUserMedia(kind==='audio'?{audio:true}:{video:{facingMode:'user'},audio:true});if(recording!==ctx||ctx.aborted||current!==ownerId){stream.getTracks().forEach(x=>x.stop());return}ctx.stream=stream;if($('capture-live'))$('capture-live').srcObject=stream;const candidates=kind==='audio'?['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus']:['video/webm;codecs=vp8,opus','video/mp4','video/webm'];const mime=candidates.find(t=>MediaRecorder.isTypeSupported(t));ctx.recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);ctx.recorder.ondataavailable=e=>{if(e.data.size){ctx.chunks.push(e.data);ctx.bytes+=e.data.size;if(ctx.bytes>(kind==='audio'?20:100)*1024*1024&&ctx.recorder.state==='recording')ctx.recorder.stop()}};ctx.recorder.onstop=()=>{clearInterval(ctx.timer);stream.getTracks().forEach(x=>x.stop());if(ctx.aborted||current!==ownerId||recording!==ctx)return;recording=null;const blob=new Blob(ctx.chunks,{type:ctx.recorder.mimeType||`${kind}/webm`});if(!blob.size){closeModal();return toast('未录到有效内容，请重试')}filePreview(kind,blob,'recording',kind==='audio'?'我的声音录制':'我的视频录制')};ctx.recorder.onerror=()=>{closeModal();toast('录制失败，请重试或使用文件上传')};$('capture-state').textContent='设备已就绪，点击开始录制';$('capture-start').disabled=false}catch(e){if(recording!==ctx)return;stopCapture();$('capture-state').textContent=e.name==='NotAllowedError'?'未获得设备权限。请允许访问，或使用文件上传。':e.name==='NotFoundError'?'没有检测到所需设备，可使用文件上传。':'设备暂不可用，可使用文件上传。'}}
function startCapture(){const r=recording;if(!r?.recorder||r.recorder.state!=='inactive')return;r.started=Date.now();r.recorder.start(500);$('capture-start').disabled=true;$('capture-stop').disabled=false;$('capture-state').textContent='录制中 · 请保持环境安静';r.timer=setInterval(()=>{const n=Math.floor((Date.now()-r.started)/1000);if($('capture-time'))$('capture-time').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n>=(r.kind==='audio'?120:180)&&r.recorder.state==='recording')r.recorder.stop()},250)}

const deliveryEditable=p=>!!p?.claim&&p.claim.userId===current&&['CLAIMED','REWORK'].includes(p.status);
const deliveryVisible=(p,d)=>hasSession()&&!!p&&!!d&&d.projectId===p.id&&(p.owner===current||(p.claim?.userId===current&&d.claimId===p.claim.id));
function currentDelivery(p){return deliveries.find(d=>d.id===p?.currentDeliveryId)}
function draftFor(p){if(!deliveryDrafts[p.claim.id])deliveryDrafts[p.claim.id]={ownerId:current,projectId:p.id,claimId:p.claim.id,note:'',files:[]};return deliveryDrafts[p.claim.id]}
function deliveryFileRows(files,draft=false,deliveryId=''){return files.map(f=>`<div class="file-row"><div class="name">${esc(f.name)}<br><span class="small muted">${(f.size/1024/1024).toFixed(1)} MB</span></div><div class="toolbar" style="margin-top:0"><button class="text" data-delivery-preview="${f.id}" ${draft?'data-draft="true"':`data-delivery-id="${deliveryId}"`}>预览</button>${draft?`<button class="text" data-delivery-remove="${f.id}">移除</button>`:`<button class="text" data-delivery-download="${f.id}" data-delivery-id="${deliveryId}">下载</button>`}</div></div>`).join('')}
function deliverySection(p){const visible=deliveries.filter(d=>deliveryVisible(p,d));if(!visible.length)return '';return `<div class="section"><h3>项目成果与验收记录</h3><p class="small muted">每次提交独立保存；只对需求方与该轮承接方开放。</p>${visible.slice().reverse().map(d=>`<article class="delivery-version"><div class="delivery-version-head"><strong>第 ${d.round} 次提交</strong><span class="tag ${d.status==='ACCEPTED'?'green':''}">${({PENDING:'待验收',REJECTED:'已打回',ACCEPTED:'验收通过'})[d.status]}</span></div><p class="small muted">${fmtDate(d.submittedAt)} · ${esc(users.find(u=>u.id===d.submitterId)?.username||'—')}</p><div class="prose">${esc(d.note)}</div>${deliveryFileRows(d.files,false,d.id)}${d.feedback?`<div class="delivery-feedback"><strong>需求方修改意见</strong><p class="prose">${esc(d.feedback)}</p></div>`:''}</article>`).join('')}</div>`}
function openDelivery(){const p=project(selected);if(!deliveryEditable(p))return toast('只有当前承接方可以提交，且项目须在制作或修改中');const d=draftFor(p);modal(p.status==='REWORK'?'修改并重新提交':'提交项目成果',`<p>上传制作成果，预览确认后提交给需求方验收。当前草稿仅保存在本次页面中。</p><label for="delivery-note">交付说明 *</label><textarea id="delivery-note" maxlength="2000" placeholder="说明完成内容、本轮修改和注意事项，至少 5 字。">${esc(d.note)}</textarea><label for="delivery-files">成果文件 *</label><input id="delivery-files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.mp4,.mov,.webm,.wav,.mp3,.m4a,.ogg,.pdf,.txt,.docx,.pptx,.xlsx,.zip"><p class="field-hint">最多 10 个，每个 100 MB。图片、音频、视频、PDF、TXT 可预览；Office 文件及 ZIP 支持下载查看。</p><div id="delivery-draft-files">${deliveryFileRows(d.files,true)}</div><p id="delivery-error" class="error" role="status"></p>`,`<button data-action="close-modal">暂存并关闭</button><button class="primary" data-action="submit-delivery">提交验收</button>`)}
function addDeliveryFiles(files){const p=project(selected);if(!deliveryEditable(p))return toast('当前不能上传成果');const d=draftFor(p),incoming=Array.from(files);let error='';if(d.files.length+incoming.length>10)error='成果文件最多 10 个';else if(incoming.some(f=>f.size>100*1024*1024))error='每个成果文件不得超过 100 MB';else if(incoming.some(f=>!f.size))error='请勿上传空文件';else if(incoming.some(f=>!(/\.(png|jpe?g|webp|mp4|mov|webm|wav|mp3|m4a|ogg|pdf|txt|docx|pptx|xlsx|zip)$/i.test(f.name))))error='文件类型暂不支持，请选择列表中的格式';if(error){$('delivery-error').textContent=error;return}incoming.forEach(f=>d.files.push({id:uid(),name:f.name,size:f.size,file:f,url:URL.createObjectURL(f)}));$('delivery-error').textContent='';$('delivery-draft-files').innerHTML=deliveryFileRows(d.files,true)}
function deliveryFile(id,deliveryId,draft=false){const p=project(selected);if(draft){if(!deliveryEditable(p))return null;const d=deliveryDrafts[p.claim.id];return d?.ownerId===current?d.files.find(f=>f.id===id):null}const d=deliveries.find(d=>d.id===deliveryId);return deliveryVisible(p,d)?d.files.find(f=>f.id===id):null}
async function previewDeliveryFile(id,deliveryId,draft=false){const f=deliveryFile(id,deliveryId,draft);if(!f)return toast('无权预览该文件');const targetProject=selected,targetUser=current;const ext=f.name.split('.').pop().toLowerCase();let body='';if(['png','jpg','jpeg','webp'].includes(ext))body=`<img class="delivery-image" src="${esc(f.url)}" alt="${esc(f.name)}">`;else if(['mp4','mov','webm'].includes(ext))body=`<video class="delivery-media" src="${esc(f.url)}" controls playsinline></video>`;else if(['wav','mp3','m4a','ogg'].includes(ext))body=`<audio class="delivery-media" src="${esc(f.url)}" controls></audio>`;else if(ext==='pdf')body=`<object class="delivery-pdf" data="${esc(f.url)}" type="application/pdf"><p>浏览器不支持 PDF 预览，请下载查看。</p></object>`;else if(ext==='txt'){const text=await f.file.slice(0,200000).text();if(current!==targetUser||selected!==targetProject||!deliveryFile(id,deliveryId,draft))return;body=`<pre class="delivery-text">${esc(text)}</pre>${f.size>200000?'<p class="small muted">仅显示前 200 KB，完整内容请下载。</p>':''}`}else body='<p>该格式暂不支持在线预览，请下载后使用对应软件查看。</p>';modal('成果预览',`<p>${esc(f.name)}</p>${body}<p class="small muted">如媒体格式无法播放，可下载后查看。</p>`,`${draft?'<button data-action="open-delivery">返回提交页</button>':'<button data-action="close-modal">关闭</button>'}<button data-delivery-download="${f.id}" ${draft?'data-draft="true"':`data-delivery-id="${deliveryId}"`}>下载文件</button>`)}
function submitDelivery(){const p=project(selected);if(!deliveryEditable(p))return toast('当前项目不能提交成果');const d=draftFor(p);d.note=$('delivery-note')?.value.trim()||d.note.trim();if(d.note.length<5||d.note.length>2000)return $('delivery-error').textContent='交付说明请填写 5–2000 字';if(!d.files.length)return $('delivery-error').textContent='请至少上传一个成果文件';const round=deliveries.filter(x=>x.projectId===p.id).length+1;const submission={id:uid(),projectId:p.id,claimId:p.claim.id,submitterId:current,round,note:d.note,files:d.files.slice(),status:'PENDING',submittedAt:new Date().toISOString(),feedback:'',decidedAt:null};deliveries.push(submission);p.currentDeliveryId=submission.id;p.status='PENDING_ACCEPTANCE';delete deliveryDrafts[p.claim.id];closeModal();render();toast('成果已提交，等待需求方验收')}
function decideDelivery(accept){const p=project(selected),d=currentDelivery(p);if(p?.owner!==current||p.status!=='PENDING_ACCEPTANCE'||d?.status!=='PENDING')return toast('只有需求方可以验收当前提交');if(accept)modal('确认验收通过？','<p>本轮成果将标记为验收通过，项目完成。此操作不涉及支付或结算。</p>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-delivery-accept">确认通过</button>');else modal('打回重做','<p>说明哪些内容未达到要求，承接方修改后可再次上传并提交。</p><label for="delivery-feedback">修改意见 *</label><textarea id="delivery-feedback" maxlength="1000" placeholder="具体说明需要修改的内容，至少 5 字。"></textarea>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-delivery-reject">打回重做</button>')}
function commitDeliveryDecision(accept,feedback=''){const p=project(selected),d=currentDelivery(p);if(p?.owner!==current||p.status!=='PENDING_ACCEPTANCE'||d?.status!=='PENDING'||d.claimId!==p.claim?.id)return toast('验收已处理或你没有权限');if(!accept&&(feedback.trim().length<5||feedback.trim().length>1000))return toast('修改意见请填写 5–1000 字');d.status=accept?'ACCEPTED':'REJECTED';d.feedback=accept?'':feedback.trim();d.decidedAt=new Date().toISOString();d.decidedBy=current;p.status=accept?'COMPLETED':'REWORK';if(accept){const c=claims.find(c=>c.id===p.claim.id);c.status='COMPLETED';c.ended=d.decidedAt}closeModal();render();toast(accept?'验收通过，项目已完成':'已打回，承接方可修改并重新提交')}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.nav){const target=b.dataset.nav;editId=null;if(['mine','publish','profile'].includes(target)&&needLogin())return;go(target);return}
if(b.dataset.detail){go('detail',b.dataset.detail);return}
if(b.dataset.page){page=Number(b.dataset.page);renderList();return}
if(b.dataset.mine){mineTab=b.dataset.mine;render();return}
if(b.dataset.profile){profileTab=b.dataset.profile;render();return}
if(b.dataset.adminTab){if(!isAdmin())return;adminTab=b.dataset.adminTab;adminKeyword='';adminPage=1;render();return}
if(b.dataset.adminStatus){if(!isAdmin())return;adminStatus=b.dataset.adminStatus;adminPage=1;render();return}
if(b.dataset.adminPage){if(!isAdmin())return;adminPage=Number(b.dataset.adminPage)||1;renderAdminTable();return}
if(b.dataset.adminUser){showAdminUser(b.dataset.adminUser);return}
if(b.dataset.reviewTab){reviewTab=b.dataset.reviewTab;render();return}
if(b.dataset.review){handleReview(b.dataset.review);return}
if(b.dataset.upload){$('material-'+b.dataset.upload).click();return}
if(b.dataset.record){startRecording(b.dataset.record);return}
if(b.dataset.rerecord){startRecording(b.dataset.rerecord);return}
if(b.dataset.preview){const m=user()?.materials.find(x=>x.id===b.dataset.preview);if(m)modal('素材预览',`<p>${esc(m.name)}</p><${m.kind==='audio'?'audio':'video'} src="${m.url}" controls></${m.kind==='audio'?'audio':'video'}><p class="small">${m.method==='recording'?'在线录制':'文件上传'} · 仅当前演示会话可用</p>`,'<button data-action="close-modal">关闭</button>');return}
if(b.dataset.removeMaterial){const m=user()?.materials.find(x=>x.id===b.dataset.removeMaterial);if(m)modal('删除这份素材？',`<p>${esc(m.name)}</p><p>删除后将从当前会话移除。</p>`,`<button data-action="close-modal">取消</button><button class="primary" data-confirm-remove="${m.id}">确认删除</button>`);return}
if(b.dataset.confirmRemove){const u=user(),m=u?.materials.find(x=>x.id===b.dataset.confirmRemove);if(m){URL.revokeObjectURL(m.url);u.materials=u.materials.filter(x=>x.id!==m.id);closeModal();render();toast('素材已删除')}return}
if(b.dataset.deliveryPreview){previewDeliveryFile(b.dataset.deliveryPreview,b.dataset.deliveryId,b.dataset.draft==='true');return}
if(b.dataset.deliveryRemove){const p=project(selected);if(!deliveryEditable(p))return;const d=draftFor(p),f=d.files.find(f=>f.id===b.dataset.deliveryRemove);if(f){URL.revokeObjectURL(f.url);d.files=d.files.filter(x=>x.id!==f.id);$('delivery-draft-files').innerHTML=deliveryFileRows(d.files,true)}return}
if(b.dataset.deliveryDownload){const f=deliveryFile(b.dataset.deliveryDownload,b.dataset.deliveryId,b.dataset.draft==='true');if(!f)return toast('无权下载该文件');const a=document.createElement('a');a.href=f.url;a.download=f.name;a.click();return}
if(b.dataset.download){const p=project(selected);if(!(p.owner===current||p.claim?.userId===current||isAdmin()))return toast('认领成功后才可下载附件');const a=p.attachments.find(x=>x.id===b.dataset.download);if(a){const link=document.createElement('a');link.href=a.url;link.download=a.name;link.click()}return}
const action=b.dataset.action;
if(action==='admin-clear'){if(!isAdmin())return;adminKeyword='';adminStatus='all';adminCategory='all';adminIdentity='all';adminPage=1;render();return}
if(action==='open-delivery'){openDelivery();return}
if(action==='submit-delivery'){submitDelivery();return}
if(action==='accept-delivery'){decideDelivery(true);return}
if(action==='reject-delivery'){decideDelivery(false);return}
if(action==='confirm-delivery-accept'){commitDeliveryDecision(true);return}
if(action==='confirm-delivery-reject'){commitDeliveryDecision(false,$('delivery-feedback').value);return}
if(action==='close-modal'){closeModal();return}
if(action==='logout'){current=null;returnId=null;selected=null;go('login');toast('已退出登录');return}
if(action==='send-code'){const mobile=$('login-mobile').value.trim();if(!/^1\d{10}$/.test(mobile))return $('login-error').textContent='请输入有效的 11 位手机号';if(challenge?.mobile===mobile&&Date.now()-challenge.at<60000)return $('login-error').textContent='请在 60 秒后重新获取';challenge={mobile,at:Date.now(),tries:0};$('login-error').textContent='演示验证码为 123456（未发送真实短信）';return}
if(action==='save-draft'){saveProject(true);return}
if(action==='claim'){openClaim();return}
if(action==='confirm-claim'){confirmClaim();return}
if(action==='edit-project'){const p=project(selected);if(p.owner!==current)return;editId=p.id;go('publish');return}
if(action==='withdraw'){const p=project(selected);if(p.owner!==current||p.status!=='OPEN')return toast('当前不能撤回修改');modal('撤回项目并修改？','<p>项目将从大厅移除，修改后需要重新提交审核。</p>','<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-withdraw">撤回修改</button>');return}
if(action==='confirm-withdraw'){const p=project(selected);if(p.owner!==current||p.status!=='OPEN'){closeModal();return toast('项目状态已变化，无法撤回')}p.status='DRAFT';editId=p.id;go('publish');toast('已撤回，可修改后重新提交');return}
if(action==='confirm-reject'){const reason=$('review-reason').value.trim();if(reason.length<5)return toast('驳回原因至少填写 5 个字');commitReview('reject',reason);return}
if(action==='exit-request'){requestExit();return}
if(action==='confirm-exit'){const p=project(selected),reason=$('exit-reason').value.trim();if(reason.length<5)return toast('退出原因至少填写 5 个字');if(p.claim?.userId!==current||!['CLAIMED','REWORK'].includes(p.status))return toast('当前不能申请退出');const r={id:uid(),projectId:p.id,claimId:p.claim.id,reason,status:'PENDING',previousStatus:p.status,at:new Date().toISOString()};exitRequests.push(r);p.exitId=r.id;p.status='EXIT_PENDING';closeModal();render();toast('退出申请已提交，等待需求方处理');return}
if(action==='accept-exit'){decideExit(true);return}
if(action==='deny-exit'){decideExit(false);return}
if(action==='confirm-accept-exit'){commitExit(true);return}
if(action==='confirm-deny-exit'){const reason=$('deny-reason').value.trim();if(reason.length<5)return toast('处理说明至少填写 5 个字');commitExit(false,reason);return}
if(action==='capture-start'){startCapture();return}
if(action==='capture-stop'){if(recording?.recorder?.state==='recording')recording.recorder.stop();return}
if(action==='save-material'){const m=pendingMaterial,u=user();if(!m||!u)return;if(!$('material-consent').checked)return toast('请先确认本人素材及保存授权');const name=$('material-name').value.trim();if(!name)return toast('请填写素材名称');if(m.blob.size>(m.kind==='audio'?20:100)*1024*1024)return toast('素材超出大小限制，请重新选择或录制');u.materials.push({id:uid(),kind:m.kind,blob:m.blob,method:m.method,name,url:m.url,at:new Date().toISOString(),consented:true});pendingMaterial=null;closeModal();render();toast('素材已保存到当前演示会话');return}
});
document.addEventListener('change',e=>{const t=e.target;if(['admin-category','admin-identity'].includes(t.id)){if(!isAdmin())return;if(t.id==='admin-category')adminCategory=t.value;else adminIdentity=t.value;adminPage=1;renderAdminTable();return}if(t.id==='delivery-files'){addDeliveryFiles(t.files);t.value='';return}if(t.id==='demo-role'){if(!hasSession()){go('login');return}current=t.value||null;returnId=null;editId=null;go(isAdmin()?'admin':'hall');return}if(t.id==='category-filter'){category=t.value;page=1;renderList();return}if(t.id==='status-filter'){filterStatus=t.value;page=1;renderList();return}if(t.id==='project-category'){const container=$('extended-fields');if(container.querySelector('input')&&Array.from(container.querySelectorAll('input')).some(x=>x.value)){const data={};container.querySelectorAll('input').forEach(x=>data[x.name.replace('extra_','')]=x.value);const expected=t.value;modal('切换项目分类？','<p>分类补充字段将按新分类重新填写，其他内容不变。</p>','<button data-action="close-modal" id="keep-category">取消</button><button class="primary" id="change-category">切换分类</button>');const previous=t.dataset.previous||project(editId)?.category||'general';categoryCancel=()=>{t.value=previous};$('change-category').onclick=()=>{categoryCancel=null;container.innerHTML=extraFields(expected);t.dataset.previous=expected;closeModal()}}else{container.innerHTML=extraFields(t.value);t.dataset.previous=t.value}return}if(t.dataset.material){const f=t.files[0];if(!f)return;const kind=t.dataset.material;if(f.size>(kind==='audio'?20:100)*1024*1024){toast(kind==='audio'?'音频文件不能超过 20 MB':'视频文件不能超过 100 MB');t.value='';return}const good=kind==='audio'?(f.type.startsWith('audio/')||/\.(wav|mp3|m4a|ogg|webm)$/i.test(f.name)):(f.type.startsWith('video/')||/\.(mp4|mov|webm)$/i.test(f.name));if(!good){toast('请上传正确类型的素材文件');t.value='';return}filePreview(kind,f,'upload',f.name);t.value=''}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
if(f.id==='login-form'){const d=new FormData(f),mobile=String(d.get('mobile')||'').trim(),code=String(d.get('code')||'').trim(),username=String(d.get('username')||'').trim();let error='';if(!/^1\d{10}$/.test(mobile))error='请输入有效的 11 位手机号';else if(!challenge||challenge.mobile!==mobile)error='请先获取验证码';else if(Date.now()-challenge.at>300000)error='验证码已过期，请重新获取';else if(challenge.tries>=5)error='尝试次数过多，请重新获取验证码';else if(code!=='123456'){challenge.tries++;error='验证码错误，演示验证码为 123456'}else if(!d.get('agree'))error='请先勾选演示说明';let u=users.find(x=>x.mobile===mobile);if(!u&&!error&&(username.length<2||username.length>20))error='新用户请填写 2–20 字的用户名';if(error){$('login-error').textContent=error;return}if(!u){u={id:uid(),username,mobile,realName:'',bio:'',skills:'',materials:[]};users.push(u)}current=u.id;challenge=null;const back=returnId;returnId=null;go(back?'detail':'hall',back);toast('登录成功，欢迎来到共创');return}
if(f.id==='project-form'){saveProject(false);return}
if(f.id==='identity-form'){const u=user();if(!u)return;const name=String(new FormData(f).get('realName')||'').trim();if(name.length<2||name.length>50){$('identity-error').textContent='请填写 2–50 字的姓名';return}u.realName=name;const back=returnId;returnId=null;if(back)go('detail',back);else render();toast('身份信息已完善，无需审核，可以认领项目');return}
if(f.id==='basic-form'){const u=user();if(!u)return;const d=new FormData(f),name=String(d.get('username')||'').trim();if(name.length<2||name.length>20)return toast('用户名需为 2–20 字');const avatar=$('basic-avatar').files[0];if(avatar&&(!['image/png','image/jpeg'].includes(avatar.type)||avatar.size>5*1024*1024))return toast('头像需为 PNG / JPG，且不超过 5 MB');if(avatar){if(u.avatar)URL.revokeObjectURL(u.avatar);u.avatar=URL.createObjectURL(avatar)}u.username=name;u.bio=String(d.get('bio')||'');u.skills=String(d.get('skills')||'');render();toast('个人资料已保存');return}
});
document.addEventListener('input',e=>{if(e.target.id==='admin-search'){if(!isAdmin())return;adminKeyword=e.target.value;adminPage=1;renderAdminTable();return}if(e.target.id==='delivery-note'){const p=project(selected);if(deliveryEditable(p))draftFor(p).note=e.target.value}});
$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
window.addEventListener('pagehide',()=>{stopCapture();discardPending();users.forEach(u=>{u.materials.forEach(m=>URL.revokeObjectURL(m.url));if(u.avatar)URL.revokeObjectURL(u.avatar)});projects.forEach(p=>p.attachments.forEach(a=>URL.revokeObjectURL(a.url)));deliveries.forEach(d=>d.files.forEach(f=>URL.revokeObjectURL(f.url)));Object.values(deliveryDrafts).forEach(d=>d.files.forEach(f=>URL.revokeObjectURL(f.url)))});
restoreSession();
render();
</script></body></html>
